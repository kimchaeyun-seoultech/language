<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사라지는 사전 — 단어 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Pretendard';font-weight:400;font-display:swap;src:url(Pretendard-Regular.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;font-display:swap;src:url(Pretendard-Medium.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:swap;src:url(Pretendard-Bold.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:900;font-display:swap;src:url(Pretendard-Black.woff2) format('woff2')}
:root{--bg:#efefec;--paper:#f7f7f5;--ink:#141414;--ink2:#3d3d3d;--mute:#85857f;--faint:#b9b9b4;--line:#dcdcd7;--bh:'Black Han Sans','Pretendard',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:'Pretendard',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
.top{padding:clamp(18px,3vh,32px) clamp(24px,4vw,64px) 0;display:grid;grid-template-columns:auto 1fr;gap:10px 48px;align-items:end}
.back{grid-column:1/-1;font-size:12.5px;font-weight:700;color:var(--mute);text-decoration:none;justify-self:start}
.back:hover{color:var(--ink)}
h1{font-family:var(--bh);font-weight:400;font-size:clamp(56px,9vh,104px);line-height:.95;letter-spacing:-2px}
.sub{font-size:12px;color:var(--mute);margin-top:10px;font-weight:500}
.search{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.search svg{width:28px;height:28px;flex:none}
.search input{flex:1;min-width:0;font-family:var(--bh);font-size:clamp(28px,4.4vh,44px);outline:none;letter-spacing:-.5px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--faint)}
.count{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}
.bar{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:clamp(10px,2vh,20px);flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:13px;font-weight:700;padding:6px 12px;border:1px solid var(--line);background:var(--paper);border-radius:999px;color:var(--ink2)}
.chips button:hover{border-color:var(--ink)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.legend{font-size:11.5px;color:var(--mute);display:flex;gap:14px;align-items:center}
.legend i{display:inline-block;width:22px;height:14px;border:1px dashed #c4c4bf;vertical-align:-2px;margin-right:5px}
.legend b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ink);vertical-align:-3px;margin-right:5px}
.legend b::after{content:'';border-left:6px solid var(--paper);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:2px}

.table{flex:1;min-height:0;margin:clamp(12px,2vh,20px) clamp(24px,4vw,64px) 0;display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(150px,1.25fr) repeat(5,minmax(0,1fr));align-items:stretch;border-bottom:1px solid var(--line)}
.head{border-bottom:1px solid var(--ink)}
.head>div{padding:10px 10px 9px;font-size:12px;font-weight:700;color:var(--ink2)}
.head>div small{display:block;font-size:10px;font-weight:500;color:var(--mute);margin-top:3px}
.head .m{height:3px;background:var(--line);margin-top:7px}
.head .m i{display:block;height:100%;background:var(--ink)}
.list{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.ko{padding:12px 10px}
.ko b{display:block;font-family:var(--bh);font-weight:400;font-size:24px;line-height:1.05}
.ko span{display:block;font-size:10.5px;color:var(--mute);margin-top:4px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c{padding:12px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-left:1px solid var(--line)}
.c .w{font-weight:900;font-size:17px;line-height:1.2;word-break:break-word}
.c .w2{font-size:12px;font-weight:500;color:var(--mute)}
.c.none{border-left:1px solid var(--line);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.035) 6px 7px)}
.c.none .w{font-size:12px;font-weight:700;color:var(--faint)}
.pl{display:inline-flex;align-items:center;gap:6px}
.pl button{width:20px;height:20px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.pl button::after{content:'';border-left:7px solid var(--paper);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;margin-left:2px}
.pl button.on{background:var(--paper);outline:2px solid var(--ink)}
.pl button.on::after{border-left-color:var(--ink)}
.row:not(.head):hover{background:rgba(255,255,255,.45)}
.empty{padding:60px 10px;text-align:center;color:var(--mute);font-weight:700}
.empty b{display:block;font-family:var(--bh);font-weight:400;font-size:34px;color:var(--faint);margin-bottom:8px}
.foot{padding:10px clamp(24px,4vw,64px) 14px;font-size:10.5px;color:var(--mute);line-height:1.6;border-top:1px solid var(--line);margin:0 clamp(24px,4vw,64px);padding-left:0;padding-right:0}
.foot .copy{color:var(--faint)}
mark{background:none;color:inherit;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
@media (max-width:860px){
  body{overflow:auto;height:auto}
  .top{grid-template-columns:1fr}
  .table{overflow-x:auto}
  .row{min-width:760px}
}
</style>
</head>

a lā"], "lkt": ["anpetu ki le"], "gla": ["an-diugh"]}, "a": {}}, {"en": "tomorrow", "cat": "시간", "sense": "on the day after the present day", "ko": ["내일", "래일"], "w": {"eus": ["bihar"], "haw": ["'apōpō", "ʻapōpō"], "gla": ["a-màireach"]}, "a": {}}, {"en": "yesterday", "cat": "시간", "sense": "day before today", "ko": ["어제", "작일"], "w": {"eus": ["atzo"], "lkt": ["htalehã"], "gla": ["an-dè"]}, "a": {}}, {"en": "now", "cat": "시간", "sense": "at the present time", "ko": ["지금", "이제"], "w": {"eus": ["orain"], "haw": ["ʻānō"], "gla": ["a-nis", "an-dràsta"]}, "a": {}}, {"en": "week", "cat": "시간", "sense": "period of seven days", "ko": ["주", "주일"], "w": {"eus": ["aste"], "haw": ["pule"], "gla": ["seachdain"]}, "a": {}}, {"en": "month", "cat": "시간", "sense": "period into which a year is divided", "ko": ["달", "월", "월간"], "w": {"eus": ["hil", "hilabete"], "cha": ["pulan"], "haw": ["mahina"], "gla": ["mìos"]}, "a": {}}, {"en": "summer", "cat": "시간", "sense": "hottest season", "ko": ["여름", "하계"], "w": {"eus": ["uda"], "gla": ["samhradh"]}, "a": {}}, {"en": "winter", "cat": "시간", "sense": "fourth season, marked by short days and the lowest temperatures", "ko": ["겨울", "동계"], "w": {"eus": ["negu"], "gla": ["geamhradh"]}, "a": {}}, {"en": "time", "cat": "시간", "sense": "inevitable passing of events", "ko": ["시간"], "w": {"eus": ["denbora"], "haw": ["wā"], "gla": ["àm"]}, "a": {"eus": "eus-001-009.mp3"}}], CATS=["몸", "사람", "자연", "동물", "음식", "집과 물건", "움직임", "모양과 성질", "수", "시간"];
const LANGS=[['haw','하와이어','ʻŌlelo Hawaiʻi'],['lkt','라코타어','Lakȟótiyapi'],['gla','게일어','Gàidhlig'],['cha','차모로어','Finuʼ Chamoru'],['eus','바스크어','Euskara']];
const $=id=>document.getElementById(id);
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[ʻʼ'’`‘]/g,'').toLowerCase();
D.forEach(r=>{r.key=[...r.ko,r.en].join(' ')+' '+fold(Object.values(r.w).flat().join(' '))+' '+r.en.toLowerCase();});
// 머리줄: 언어별로 남은 기록 비율
$('head').innerHTML='<div>한국어<small>영어 뜻풀이</small></div>'+LANGS.map(([k,n,nat])=>{
  const c=D.filter(r=>r.w[k]).length;
  return `<div>${n}<small>${nat} · ${c}/${D.length}</small></div>`;}).join('');
let cat='전체';
$('chips').innerHTML=['전체',...CATS].map(c=>`<button class="${c===cat?'on':''}">${c}</button>`).join('');
$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.textContent;[...$('chips').children].forEach(x=>x.classList.toggle('on',x===b));render();});
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hl(text,q){
  if(!q)return esc(text);
  const f=fold(text), i=f.indexOf(fold(q)); if(i<0)return esc(text);
  // fold로 길이가 바뀔 수 있어 원문 기준으로 대략 맞춘다
  const chars=[...text]; let acc='',st=-1,en=-1;
  for(let j=0;j<chars.length;j++){const before=acc.length;acc+=fold(chars[j]);if(st<0&&acc.length>i)st=j;if(st>=0&&acc.length>=i+fold(q).length){en=j;break;}}
  if(st<0||en<0)return esc(text);
  return esc(chars.slice(0,st).join(''))+'<mark>'+esc(chars.slice(st,en+1).join(''))+'</mark>'+esc(chars.slice(en+1).join(''));
}
function render(){
  const q=$('q').value.trim(), fq=fold(q);
  const L=D.filter(r=>(cat==='전체'||r.cat===cat)&&(!q||r.key.includes(q)||r.key.includes(fq)));
  $('cnt').textContent=q||cat!=='전체'?`${L.length}개`:'';
  if(!L.length){$('list').innerHTML=`<div class="empty"><b>“${esc(q)}”</b>기초어 ${D.length}개 중에 없음</div>`;return;}
  $('list').innerHTML=L.map(r=>`<div class="row"><div class="ko"><b>${hl(r.ko[0],q)}</b><span title="${esc(r.sense||'')}">${hl(r.en,q)}${r.sense?' — '+esc(r.sense):''}</span></div>`+
    LANGS.map(([k])=>{
      const ws=r.w[k]; if(!ws)return '<div class="c none"><span class="w">기록 없음</span></div>';
      const a=r.a&&r.a[k];
      const first=`<span class="w">${hl(ws[0],q)}</span>`;
      return `<div class="c">${a?`<span class="pl"><button data-a="${a}" aria-label="듣기"></button>${first}</span>`:first}${ws.length>1?`<span class="w2">${ws.slice(1,3).map(w=>hl(w,q)).join(', ')}</span>`:''}</div>`;
    }).join('')+'</div>').join('');
}
$('q').addEventListener('input',render);
const audio=new Audio(); let curB=null;
$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;
  if(curB)curB.classList.remove('on'); curB=b; b.classList.add('on'); audio.src=b.dataset.a; audio.play().catch(()=>{});});
audio.addEventListener('ended',()=>{if(curB)curB.classList.remove('on');});
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus();}});
render();
})();
</script>
