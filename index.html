<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사라지는 사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Pretendard';font-weight:500;font-display:swap;src:url(Pretendard-Medium.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:swap;src:url(Pretendard-Bold.woff2) format('woff2')}
:root{--paper:#efefeb;--ink:#141414;--mute:#85857f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--paper)}
body{font-family:'Pretendard',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
#g{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#g.drag{cursor:grabbing}
#g.hot{cursor:pointer}
.ttl{position:fixed;left:0;right:0;top:clamp(14px,3vh,40px);text-align:center;font-family:'Black Han Sans','Pretendard',sans-serif;font-size:min(19vh,12.5vw);line-height:1;letter-spacing:-.03em;pointer-events:none;z-index:2}
.ttl span{display:inline-block;transition:opacity 1.6s}
.ttl span.gone{opacity:.08}

/* 많이 쓰이는 언어: 흰 창 / 사라지고 있는 언어: 검은 창 */
.pop{position:fixed;left:0;top:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .35s,transform .35s;transform:translateY(6px)}
.pop.on{opacity:1;transform:none}
.pop .n{font-family:'Black Han Sans','Pretendard',sans-serif;line-height:1;white-space:nowrap}
.pop .s{font-weight:500;white-space:nowrap}
.pop .s small{display:block;font-size:12px;font-weight:700;margin-top:7px}
.pop.white{background:#fff;border:1px solid #d6d6d1;padding:7px 10px 6px;color:#6f6f69}
.pop.white .n{font-family:'Pretendard',sans-serif;font-weight:700;font-size:13px}
.pop.white .s{font-size:11px;font-weight:500;margin-top:3px;color:#9a9a94}
.pop.black{background:var(--ink);color:var(--paper);width:360px;height:170px;padding:24px 26px}
.pop.black .n{font-size:64px}
.pop.black .s{font-size:19px;margin-top:16px}
.pop.black .s small{color:#8f8f89}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div class="ttl" id="ttl"></div>
<div class="pop" id="pop"><div class="n"></div><div class="s"></div></div>

  es:{nm:'스페인어',spk:'약 5억 5,800만 명',g:1.9,poly:[
    [[-9.3,43.3],[-1.8,43.4],[3.3,42.4],[0.5,40.5],[-0.5,38.5],[-2,36.7],[-5.6,36],[-7.4,37.2],[-7,38.9],[-6.9,41.9],[-8.9,42]],
    [[-117,32.5],[-114.8,32.5],[-106.5,31.8],[-97.2,26],[-97.5,22],[-94.5,18.3],[-90.5,21.2],[-86.8,21.5],[-88,16],[-83.2,15],[-83.5,11],[-77.3,8.6],[-80.5,7.5],[-85.7,10],[-87.5,13],[-91.9,14.5],[-96,15.6],[-105.5,19.8],[-110,23],[-112,25.8],[-114,29.5]],
    [[-81,-4],[-80,1],[-77.5,8.5],[-72,12],[-62,10.6],[-60.5,7],[-67,1.5],[-70,-4],[-73,-7],[-70,-11],[-69,-15],[-67,-22.8],[-62.5,-22],[-58,-20],[-57.6,-25.3],[-54.6,-25.7],[-53.6,-27.2],[-57.6,-30.2],[-53.4,-33.7],[-58,-38],[-62,-39],[-65,-55],[-75,-52],[-73.5,-41],[-71.5,-30],[-70.5,-18],[-76,-14],[-79.5,-7]]]},
  fr:{nm:'프랑스어',spk:'약 3억 1,200만 명',g:1.8,poly:[
    [[-4.8,48.5],[-1.6,49.7],[2.5,51.1],[8.2,49],[7.5,47.6],[6.1,46.2],[7.6,44.1],[3.1,42.4],[-1.8,43.4],[-1.2,46.2]]]},
  pt:{nm:'포르투갈어',spk:'약 2억 6,700만 명',g:1.8,poly:[
    [[-73.9,-7.3],[-69.5,-10.9],[-65.3,-9.8],[-60,-13.7],[-58,-16.3],[-57.6,-20],[-54.6,-25.7],[-53.6,-27.2],[-57.6,-30.2],[-53.4,-33.7],[-48,-28],[-41,-22.5],[-39,-17],[-35,-9],[-35,-5.2],[-44,-2.4],[-50,0],[-51.6,4.2],[-60,5.2],[-63.5,3.9],[-67,1.5],[-70,-4]],
    [[-9.5,42],[-6.2,42],[-7,38.9],[-7.4,37.2],[-9,37],[-9.5,39]]]},
  ru:{nm:'러시아어',spk:'약 2억 5,300만 명',g:1.8,poly:[
    [[28,69.5],[30.5,60],[28,56.5],[31.5,52.5],[40,49.5],[38,47],[40,43.5],[47.5,42],[47,45.5],[50,48],[55,51],[61,50.5],[69.5,55],[76,54],[87,49.2],[98,50],[108,49.5],[116.5,49.8],[120,53.3],[127.5,49.8],[135,48.3],[131,42.8],[141,46],[143,53],[141.5,58.5],[155,59.5],[163,59.5],[160,52.5],[170,60],[180,65],[180,72],[140,74],[110,78],[100,79],[70,74],[55,71],[43,68.5]]]},
  ja:{nm:'일본어',spk:'약 1억 2,600만 명',g:1.7,poly:[
    [[129.5,33],[131,31],[135.5,33.5],[139.5,34.8],[141,36],[142,39.5],[141.5,41.5],[145.5,43.3],[141.8,45.5],[139.8,42],[139.8,40],[137,37],[133,35.5],[130.8,34]]]},
  ko:{nm:'한국어',spk:'약 8,200만 명',g:1.7,poly:[
    [[124.6,37.7],[124.3,39.8],[129.3,42.4],[130.7,42.3],[129.5,37.5],[129.4,35.2],[126.3,34.3],[126.1,36.5]]]},
};
const MK=Object.keys(MAJ), MP={}; MK.forEach(k=>{MP[k]=0; MAJ[k].bb=MAJ[k].poly.map(p=>{let a=180,b=-180,c=90,d=-90;p.forEach(([x,y])=>{a=Math.min(a,x);b=Math.max(b,x);c=Math.min(c,y);d=Math.max(d,y);});return [a,b,c,d];}); MAJ[k].cen=MAJ[k].bb.map(([a,b,c,d])=>[(a+b)/2,(c+d)/2]);});
const EXPAND=.55; // 마우스를 올리면 영역이 이만큼 넓어진다
function inPoly(p,x,y){let ins=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins;}return ins;}
function majorAt(lat,lon,grow){lon=((lon+180)%360+360)%360-180;
  for(const k of MK){const m=MAJ[k], s=grow?1+MP[k]*EXPAND:1; if(grow&&MP[k]<=0)continue;
    for(let i=0;i<m.poly.length;i++){const b=m.bb[i],[ox,oy]=m.cen[i];
      const x=ox+(lon-ox)/s, y=oy+(lat-oy)/s; if(x<b[0]||x>b[1]||y<b[2]||y>b[3])continue; if(inPoly(m.poly[i],x,y))return k;}}
  return null;}
// 마우스를 올렸을 때: 화자가 많으면 점이 커지고, 적으면 점이 사라진다
const GROW={eus:.85,gla:.7,cha:.7,haw:1,lkt:1}, VANISH={eus:.35,gla:.55,cha:.6,haw:1,lkt:1}, HP={}; KEYS.forEach(k=>HP[k]=0);
const hash=(a,b)=>{let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;};
const cv=document.getElementById('g'), pop=document.getElementById('pop');

// 땅 (메르카토르 PNG)
let landA=null, LW=0;
const img=new Image(); img.src='world.png';
img.onload=()=>{const c=document.createElement('canvas');LW=c.width=img.width;c.height=img.height;const g=c.getContext('2d');g.drawImage(img,0,0);
  const d=g.getImageData(0,0,LW,LW).data; landA=new Uint8Array(LW*LW); for(let i=0;i<LW*LW;i++)landA[i]=d[i*4+3]>100?1:0;};
function isLand(lat,lon){
  if(lat>83)return false; if(lat<-84)return true;
  lon=((lon+180)%360+360)%360-180;
  const X=(lon+180)/360, r=lat*D, Y=(Math.PI-Math.log(Math.tan(Math.PI/4+r/2)))/(2*Math.PI);
  return landA[Math.min(LW-1,Math.floor(Y*LW))*LW+Math.min(LW-1,Math.floor(X*LW))]===1;
}

// 언어 지역: 실제 모양을 화자 수에 맞춰 키우거나 줄인다
const R2={};
KEYS.forEach(k=>{
  const r=REG[k], [clat,clon]=r.c; let ext=0;
  r.p.forEach(([la,lo])=>{ext=Math.max(ext,Math.hypot(la-clat,(lo-clon)*Math.cos(clat*D)));});
  const target=.5*Math.pow(LANG[k].n/1000,.36);       // 화자 수 → 지역 반지름(도)
  R2[k]={p:r.p,c:[clat,clon],sp:Math.max(r.sp,.1),ext:Math.max(ext,.3),s:1};
});

// 둥근 지구본 (정사영), 화면 아래쪽에
let W,H,dot,cx,cy,R, lam=-30, phi=28, vlam=0, vphi=0, dragging=false, idle=0, hover=null;
function resize(){
  W=innerWidth; H=innerHeight; const d=devicePixelRatio||1; cv.width=W*d; cv.height=H*d; cv.getContext('2d').setTransform(d,0,0,d,0,0);
  R=Math.min(W*.36,H*.4); cx=W/2; cy=H*.3+R;
  dot=Math.max(5,Math.round(R/62));
}
resize(); addEventListener('resize',resize);
function inv(mx,my){ // 화면 → 위경도
  const x=(mx-cx)/R, y=-(my-cy)/R, rho=Math.hypot(x,y); if(rho>=1)return null;
  const c=Math.asin(rho), sc=Math.sin(c), cc=Math.cos(c), sl=Math.sin(phi*D), cl=Math.cos(phi*D);
  const lat=rho?Math.asin(cc*sl+y*sc*cl/rho)/D:phi, lon=lam+(rho?Math.atan2(x*sc,rho*cc*cl-y*sc*sl)/D:0);
  return [lat,lon,cc];
}
function regionAt(lat,lon,pad){
  for(const k of KEYS){const r=R2[k], [cl,co]=r.c; const dlon=((lon-co+540)%360)-180, cosl=Math.cos(cl*D);
    const dist=Math.hypot(lat-cl,dlon*cosl); if(dist>r.ext*r.s+pad+.6)continue;
    // 줄이거나 키운 모양 안인가: 거꾸로 원래 좌표로 되돌려 본다
    const ola=cl+(lat-cl)/r.s, olo=co+dlon/r.s, rad=r.sp*.9+(pad+.9)/r.s;
    for(const p of r.p){const a=p[0]-ola,b=(p[1]-olo)*cosl; if(a*a+b*b<rad*rad)return k;}
  }
  return null;
}
function frame(t){
  const g=cv.getContext('2d'); g.clearRect(0,0,W,H);
  if(!landA)return;
  // 커졌다 작아졌다
  KEYS.forEach(k=>{const tg=k===hover?1:0; HP[k]+=(tg-HP[k])*(tg?.05:.08); if(Math.abs(tg-HP[k])<.003)HP[k]=tg;});
  let anyM=false; MK.forEach(k=>{const tg=k===hover?1:0; MP[k]+=(tg-MP[k])*(tg?.06:.08); if(Math.abs(tg-MP[k])<.003)MP[k]=tg; if(MP[k]>0)anyM=true;});
  const ds=dot*.56;
  const x0=cx-R+((R%dot)), y0=cy-R+((R%dot));
  for(let y=y0;y<Math.min(H,cy+R);y+=dot)for(let x=x0;x<cx+R;x+=dot){
    const q=inv(x,y); if(!q)continue; const [lat,lon,cc]=q;
    const edge=Math.pow(cc,.6); // 가장자리일수록 작게
    const k=regionAt(lat,lon,0);
    if(k){const p=HP[k];
      if(p>0&&hash(Math.round(lat*5),Math.round(lon*5))<p*VANISH[k]){ // 사라진 자리: 아주 옅은 점만
        g.fillStyle='rgba(20,20,20,.09)'; const s=ds*.38; g.fillRect(x-s/2,y-s/2,s,s); continue;}
      g.fillStyle='#000'; const s=ds*1.7*(.6+.4*edge)*(1+p*(GROW[k]-1)); g.fillRect(x-s/2,y-s/2,s,s); continue;}
    const mk=anyM?majorAt(lat,lon,true):null, land=isLand(lat,lon);
    if(land){let m=1,a=.28+.45*edge;
      if(mk){m=1+MP[mk]*(MAJ[mk].g-1)*.75; a=a+(.5-a)*MP[mk];}
      g.fillStyle=`rgba(20,20,20,${a})`; const s=ds*(.65+.35*edge)*m; g.fillRect(x-s/2,y-s/2,s,s);}
    else if(mk){g.fillStyle=`rgba(20,20,20,${.34*MP[mk]})`; const s=ds*(.65+.35*edge)*(1+MP[mk]*.3); g.fillRect(x-s/2,y-s/2,s,s);} // 바다까지 번진다
    else{g.fillStyle='rgba(20,20,20,.09)'; const s=ds*.38*(.5+.5*edge); g.fillRect(x-s/2,y-s/2,s,s);} // 바다도 옅은 점으로 둥글게
  }
}
// 창
let popT=0, popK=null;
function showPop(k,x,y){
  const many=!!MAJ[k], L=many?MAJ[k]:LANG[k];
  pop.className='pop '+(many?'white':'black'); pop.querySelector('.n').textContent=L.nm;
  pop.querySelector('.s').innerHTML=many?`${L.spk}이 사용하는 언어`:`남은 화자 ${L.spk}<small>사라지고 있는 언어 · 눌러서 들어가기</small>`;
  const r=pop.getBoundingClientRect(); let px=x+20, py=y-r.height-20; if(px+r.width>W-10)px=x-r.width-20; if(py<10)py=y+20;
  pop.style.left=px+'px'; pop.style.top=py+'px';
  requestAnimationFrame(()=>pop.classList.add('on'));
  clearTimeout(popT); popT=setTimeout(()=>pop.classList.remove('on'),2600); // 잠시 떴다 사라진다
}
let last=null, moved=0;
cv.addEventListener('pointerdown',e=>{dragging=true;last=[e.clientX,e.clientY];moved=0;cv.setPointerCapture(e.pointerId);cv.classList.add('drag');vlam=vphi=0;});
cv.addEventListener('pointermove',e=>{
  if(dragging){const dx=e.clientX-last[0], dy=e.clientY-last[1]; moved+=Math.abs(dx)+Math.abs(dy); const k=90/R; lam-=dx*k; phi=Math.max(-85,Math.min(85,phi+dy*k)); vlam=-dx*k; vphi=dy*k; last=[e.clientX,e.clientY]; idle=performance.now(); return;}
  const q=inv(e.clientX,e.clientY); let k=q?regionAt(q[0],q[1],1.2):null;
  if(!k&&q&&isLand(q[0],q[1]))k=majorAt(q[0],q[1],false);
  if(k!==hover){hover=k; cv.classList.toggle('hot',!!(k&&LANG[k])); if(k){popK=k;showPop(k,e.clientX,e.clientY);} else {pop.classList.remove('on');}}
});
cv.addEventListener('pointerup',e=>{dragging=false;cv.classList.remove('drag');idle=performance.now();
  if(moved<4){const q=inv(e.clientX,e.clientY), k=q?regionAt(q[0],q[1],1.2):null; if(k)location.href=LANG[k].href;}});
cv.addEventListener('mouseleave',()=>{hover=null;cv.classList.remove('hot');pop.classList.remove('on');});
function loop(t){
  if(!dragging){lam+=vlam; phi=Math.max(-85,Math.min(85,phi+vphi)); vlam*=.93; vphi*=.93; if(!hover&&t-idle>2500&&Math.abs(vlam)<.01)lam-=.05;}
  frame(t); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 제목이 조금씩 흐려진다
const ttl=document.getElementById('ttl'); ttl.innerHTML=[...'사라지는 언어들'].map(c=>`<span>${c===' '?'&nbsp;':c}</span>`).join('');
setInterval(()=>{const sp=[...ttl.children].filter(s=>s.textContent.trim()), g=ttl.querySelectorAll('.gone');
  if(g.length>=2||Math.random()<.4){if(g.length)g[0].classList.remove('gone');} else sp[Math.floor(Math.random()*sp.length)].classList.add('gone');},2600);
})();
</script>
